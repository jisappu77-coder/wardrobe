name: Deploy Virtual Wardrobe Mockups to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download browser AI model assets
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p poc/models/Xenova/clip-vit-base-patch32
          hf download Xenova/clip-vit-base-patch32 \
            --local-dir poc/models/Xenova/clip-vit-base-patch32 \
            --include "config.json" "preprocessor_config.json" "special_tokens_map.json" "tokenizer.json" "tokenizer_config.json" "vocab.json" "merges.txt" "onnx/vision_model_q4f16.onnx" "onnx/text_model_q4f16.onnx"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
